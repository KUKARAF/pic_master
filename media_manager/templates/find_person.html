{% extends "base.html" %}

{% block title %}Find {{ name }} — media{% endblock %}

{% block content %}
<div class="page-heading">
  <h1>Find {{ name }}</h1>
  <a href="/person/{{ name | urlencode }}" class="sub">← Back to {{ name }}</a>
</div>

<label class="sub" style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
  <input type="checkbox" id="find-person-avoid-existing-toggle" checked>
  Deprioritize photos that already have an identified face
</label>

<label class="sub" style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
  Keep searching until
  <input type="range" id="find-person-buffer-size-slider" min="10" max="200" step="10" value="10">
  <span id="find-person-buffer-size-value">10</span>
  are found
</label>

<label class="sub" style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;">
  <input type="checkbox" id="find-person-auto-approve-toggle">
  Auto-approve above threshold
  <input type="number" id="find-person-auto-approve-threshold" min="0" max="1" step="0.01" value="0.75"
         style="display:none;width:70px;" title="Suggested starting point — raise it if auto-approved matches turn out wrong.">
</label>
<div id="find-person-auto-approve-timer" class="sub" style="display:none;margin-bottom:10px;"></div>

<!-- Auto-labeling actions, grouped with the settings above the swipe stack. -->
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
  <button type="button" id="auto-calibrate-btn" class="btn-similar"
          title="Swipe through the riskiest matches (lowest score first) to set a confidence threshold, then add everyone at/above it to {{ name }} in one go.">
    🎯 Calibrate &amp; auto-add
  </button>
  <button type="button" id="auto-add-top-match-btn" class="btn-similar"
          title="Sweeps every unnamed face and adds to {{ name }} exactly those where {{ name }} is the closest known person — i.e. no one else matches that face more strongly. Runs in the background; safe to leave the page.">
    🪄 Auto-add all where {{ name }} is the top match
  </button>
  <span id="auto-add-top-match-status" class="sub"></span>
</div>

<div class="swipe-page">
  <div class="swipe-stack-wrap" id="find-person-swipe-stack"></div>
  <div class="swipe-controls">
    <button type="button" class="swipe-btn swipe-btn-reject" id="find-person-swipe-reject-btn" title="Not same face (↓)">✕</button>
    <button type="button" class="swipe-btn swipe-btn-confirm" id="find-person-swipe-confirm-btn" title="Same face (↑)">✓</button>
  </div>
  <div class="swipe-hint">Swipe up to confirm, down to reject, left if not sure (or use ↑ / ↓ / ←)</div>
</div>

<!-- Calibration swipe UI mounts here (shown while calibrating; main stack hidden). -->
<div id="calibrate-panel" style="display:none;margin-top:14px;"></div>
{% endblock %}

{% block scripts %}
<script src="/static/swipe-core.js"></script>
<script>
/* Identity-scoped face-suggestion stream — same /api/face-suggestions/next
   stream as /faces, but scoped via `identity` to just this one person's
   confirmed embeddings (see _next_face_suggestions' identity_filter). Bias
   is meaningless in this scoped mode (every candidate already shares this
   identity), so fetchMoreUrl never sends bias params. */
(function() {
  const personName = {{ name | tojson }};
  if (!personName || !window.initSwipeStack || !document.getElementById('find-person-swipe-stack')) return;

  function wireExpandSimilarSearch() {
    wireExpandSearchGrid({
      sliderId: 'similar-threshold-slider',
      sliderValueId: 'similar-threshold-value',
      expandBtnId: 'expand-similar-btn',
      statusId: 'expand-similar-status',
      gridId: 'similar-unknown-grid',
      fetchUrl: function(threshold) {
        return '/api/identities/' + encodeURIComponent(personName) + '/similar-faces?threshold=' + threshold;
      },
      cardHtml: function(f) {
        return (
          '<div class="card" id="unknown-card-' + f.ref + '">' +
            '<a class="card-img-link" href="/photo/' + f.file_id + '">' +
              '<img src="/face-crop/' + f.ref + '" alt="' + escapeHtml(f.filename) + '" loading="lazy">' +
            '</a>' +
            '<span class="score-badge">' + f.score.toFixed(3) + '</span>' +
            '<div class="card-body">' +
              '<div class="card-name" title="' + escapeHtml(f.path) + '">' + escapeHtml(f.identity || f.filename) + '</div>' +
              '<button type="button" class="btn-similar expand-grid-use-btn" ' +
                'style="font-size:0.8em;padding:4px 10px;margin-top:6px;">Use "' + escapeHtml(personName) + '"</button>' +
            '</div>' +
          '</div>'
        );
      },
      confirmRequest: function(f) {
        return { url: '/api/faces/' + encodeURIComponent(f.ref) + '/identity', method: 'POST', body: { name: personName } };
      },
      noResultsText: function(threshold) {
        return 'Still no matches at threshold ' + parseFloat(threshold).toFixed(2) + ' — try lowering it further.';
      },
    });
  }

  const bufferSizeSlider = document.getElementById('find-person-buffer-size-slider');

  /* Auto-approve above threshold: once a card's own match score clears the
     configured threshold, show a 5s countdown and auto-confirm it if nothing
     interrupts first. Any card change (a manual decide, undo, or a refill
     that re-renders) re-arms from scratch via onTopCardChange below, so
     there's never more than one countdown live and a manual swipe always
     cancels the pending one for free (decide() re-renders before the timeout
     could fire). Unchecking the box, or a top card whose score doesn't clear
     the bar, just cancels/skips arming — nothing else changes. */
  const autoApproveToggle = document.getElementById('find-person-auto-approve-toggle');
  const autoApproveThresholdInput = document.getElementById('find-person-auto-approve-threshold');
  const autoApproveTimerEl = document.getElementById('find-person-auto-approve-timer');
  let autoApproveHandle = null; // {intervalId, timeoutId}

  function cancelAutoApprove() {
    if (autoApproveHandle) {
      clearInterval(autoApproveHandle.intervalId);
      clearTimeout(autoApproveHandle.timeoutId);
      autoApproveHandle = null;
    }
    autoApproveTimerEl.style.display = 'none';
  }

  function armAutoApprove(card) {
    cancelAutoApprove();
    if (!autoApproveToggle.checked || !card) return;
    const threshold = parseFloat(autoApproveThresholdInput.value);
    if (!isFinite(threshold) || card.score < threshold) return;
    let remaining = 5;
    function paint() {
      autoApproveTimerEl.textContent = 'Auto-approving in ' + remaining + 's… (swipe or click to cancel)';
    }
    autoApproveTimerEl.style.display = 'block';
    paint();
    const intervalId = setInterval(function () {
      remaining--;
      if (remaining > 0) paint();
    }, 1000);
    const timeoutId = setTimeout(function () {
      cancelAutoApprove();
      stack.decide('confirm');
    }, 5000);
    autoApproveHandle = { intervalId, timeoutId };
  }

  autoApproveToggle.addEventListener('change', function () {
    autoApproveThresholdInput.style.display = autoApproveToggle.checked ? 'inline-block' : 'none';
    if (autoApproveToggle.checked) {
      armAutoApprove(stack.getTopCard());
    } else {
      cancelAutoApprove();
    }
  });
  autoApproveThresholdInput.addEventListener('change', function () {
    armAutoApprove(stack.getTopCard());
  });

  const stack = window.initSwipeStack({
    stackElId: 'find-person-swipe-stack',
    confirmBtnId: 'find-person-swipe-confirm-btn',
    rejectBtnId: 'find-person-swipe-reject-btn',
    bufferSize: bufferSizeSlider ? parseInt(bufferSizeSlider.value, 10) : 10,
    initialCards: [],
    fetchMoreUrl: function(excludeSet, biasKey, biasAction, need) {
      const avoidToggle = document.getElementById('find-person-avoid-existing-toggle');
      const params = new URLSearchParams({
        count: String(need || 10),
        identity: personName,
        avoid_existing: String(!avoidToggle || avoidToggle.checked),
      });
      return '/api/face-suggestions/next?' + params.toString();
    },
    renderCard: function(card) {
      return {
        imageUrl: '/face-crop/' + encodeURIComponent(card.ref),
        questionHtml: 'Is this <strong>' + escapeHtml(personName) + '</strong>?',
        scoreText: 'match score ' + card.score.toFixed(2),
        metaHtml: swipeCardMeta(card),
        originalUrl: '/photo/' + card.file_id,
      };
    },
    onConfirm: function(card) {
      return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/identity', method: 'POST', body: { name: personName } };
    },
    onReject: function(card) {
      return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/reject', method: 'POST' };
    },
    onUndo: function(card) {
      return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/decision', method: 'DELETE' };
    },
    onTopCardChange: function(card) {
      armAutoApprove(card);
    },
    emptyStateHtml: function(stackEl) {
      stackEl.innerHTML =
        '<div class="alert" id="similar-empty-state">' +
          '<p style="margin-bottom:10px;">No similar unidentified faces found at the default threshold.</p>' +
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
            '<label for="similar-threshold-slider" style="font-size:0.85em;">Match threshold:</label>' +
            '<input type="range" id="similar-threshold-slider" min="0.10" max="0.45" step="0.05" value="0.30">' +
            '<span id="similar-threshold-value" class="sub">0.30</span>' +
            '<button type="button" id="expand-similar-btn" class="btn-similar" style="font-size:0.85em;">Expand similar face search</button>' +
          '</div>' +
          '<div id="expand-similar-status" class="sub" style="margin-top:8px;display:none;"></div>' +
        '</div>' +
        '<div class="grid" id="similar-unknown-grid" style="margin-top:16px;"></div>';
      wireExpandSimilarSearch();
    },
  });

  wireBufferSizeSlider(stack, 'find-person-buffer-size-slider', 'find-person-buffer-size-value');

  /* Calibrate & auto-add: swipe through the riskiest (lowest-score) candidate
     matches — same Tinder cards as the main review — to establish a confidence
     threshold, then bulk-confirm everyone at/above the lowest card you swiped
     'same'. The main review stack is paused (its keyboard/drag gated via the new
     pause/resume) and hidden while calibrating, so only the calibration stack
     reacts to input. Reuses /calibration-batch (riskiest-first) and
     /confirm-above-threshold; nothing persists across a reload. */
  function wireAutoCalibrate() {
    const btn = document.getElementById('auto-calibrate-btn');
    const panel = document.getElementById('calibrate-panel');
    const swipePage = document.querySelector('.swipe-page');  // the MAIN stack's page
    if (!btn || !panel) return;

    const SAMPLE = 40;   // riskiest candidates to seed the calibration swipe
    const FLOOR = 0.10;  // include the risky low-score tail
    let calStack = null;
    let lowestSame = null;   // min score among cards swiped 'same' this session
    let previewTimer = null;

    function idBase() { return '/api/identities/' + encodeURIComponent(personName); }

    function exit() {
      if (calStack) calStack.pause();
      clearTimeout(previewTimer);
      panel.style.display = 'none';
      panel.innerHTML = '';
      if (swipePage) swipePage.style.display = '';
      stack.resume();
      stack.refill();
      btn.disabled = false;
    }

    function updatePreview() {
      const line = document.getElementById('calib-threshold-line');
      const addBtn = document.getElementById('calib-add-all-btn');
      if (!line) return;
      if (lowestSame == null) {
        line.textContent = 'Swipe a match up (same) to set the threshold.';
        if (addBtn) addBtn.disabled = true;
        return;
      }
      if (addBtn) addBtn.disabled = false;
      line.textContent = 'Threshold ≈ ' + lowestSame.toFixed(3) + ' — counting…';
      clearTimeout(previewTimer);
      previewTimer = setTimeout(function () {
        fetch(idBase() + '/calibration-batch?floor=' + lowestSame + '&ceiling=1.0&count=1')
          .then(function (r) { return r.json(); })
          .then(function (d) { line.textContent = 'Threshold ≈ ' + lowestSame.toFixed(3) + ' · will add ~' + d.total + ' above it'; })
          .catch(function () {});
      }, 400);
    }

    function startCalibration(results) {
      lowestSame = null;
      cancelAutoApprove();  // don't let a pending main-stack auto-approve fire while calibrating
      panel.innerHTML =
        '<div class="sub" style="margin-bottom:8px;">Swipe the riskiest matches (lowest score first). Up = <strong>' + escapeHtml(personName) + '</strong>, down = not them.</div>' +
        '<div class="swipe-page">' +
          '<div class="swipe-stack-wrap" id="calib-swipe-stack"></div>' +
          '<div class="swipe-controls">' +
            '<button type="button" class="swipe-btn swipe-btn-reject" id="calib-reject-btn" title="Not them (↓)">✕</button>' +
            '<button type="button" class="swipe-btn swipe-btn-confirm" id="calib-confirm-btn" title="Same (↑)">✓</button>' +
          '</div>' +
          '<div class="swipe-hint">Swipe up = same, down = not them (or ↑ / ↓)</div>' +
        '</div>' +
        '<div id="calib-threshold-line" class="sub" style="margin-top:8px;"></div>' +
        '<div style="display:flex;gap:10px;margin-top:10px;">' +
          '<button type="button" id="calib-add-all-btn" class="btn-similar" disabled>✅ Add all now</button>' +
          '<button type="button" id="calib-done-btn" class="btn-similar">Done</button>' +
        '</div>';
      panel.style.display = 'block';
      if (swipePage) swipePage.style.display = 'none';
      stack.pause();

      if (calStack) calStack.pause();  // retire any previous session's stack (keeps its keys inert)
      calStack = window.initSwipeStack({
        stackElId: 'calib-swipe-stack',
        confirmBtnId: 'calib-confirm-btn',
        rejectBtnId: 'calib-reject-btn',
        initialCards: results,
        bufferSize: results.length,  // keep the whole riskiest sample (initialCards is sliced to bufferSize)
        fetchMoreUrl: function () { return null; },  // fixed riskiest sample, no refill
        renderCard: function (card) {
          return {
            imageUrl: '/face-crop/' + encodeURIComponent(card.ref),
            questionHtml: 'Is this <strong>' + escapeHtml(personName) + '</strong>?',
            scoreText: 'score ' + card.score.toFixed(3),
            metaHtml: '',
            originalUrl: '/photo/' + card.file_id,
          };
        },
        onConfirm: function (card) {
          if (lowestSame == null || card.score < lowestSame) lowestSame = card.score;
          updatePreview();
          return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/identity', method: 'POST', body: { name: personName } };
        },
        onReject: function (card) {
          return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/reject', method: 'POST' };
        },
        onUndo: function (card) {
          return { url: '/api/faces/' + encodeURIComponent(card.ref) + '/decision', method: 'DELETE' };
        },
        emptyStateHtml: '<div class="swipe-empty">That\'s the riskiest sample reviewed — press “Add all now”, or Done.</div>',
      });
      updatePreview();

      document.getElementById('calib-done-btn').addEventListener('click', exit);
      document.getElementById('calib-add-all-btn').addEventListener('click', function () {
        if (lowestSame == null) return;
        const addBtn = document.getElementById('calib-add-all-btn');
        addBtn.disabled = true;
        addBtn.textContent = 'Adding…';
        fetch(idBase() + '/confirm-above-threshold', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ threshold: lowestSame }),
        })
          .then(function (r) { if (!r.ok) throw new Error('Request failed'); return r.json(); })
          .then(function (res) { showToast('Added ' + res.confirmed + ' photo(s) as "' + personName + '".'); exit(); })
          .catch(function (err) { addBtn.disabled = false; addBtn.textContent = '✅ Add all now'; showToast('Failed: ' + err.message); });
      });
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      panel.style.display = 'block';
      panel.innerHTML = '<p class="sub">Loading riskiest candidates…</p>';
      fetch(idBase() + '/calibration-batch?floor=' + FLOOR + '&ceiling=1.0&count=' + SAMPLE)
        .then(function (r) { if (!r.ok) throw new Error('Request failed: ' + r.status); return r.json(); })
        .then(function (data) {
          if (!data.results.length) {
            panel.innerHTML = '<p class="sub">No unreviewed candidates found to calibrate on.</p>';
            btn.disabled = false;
            return;
          }
          startCalibration(data.results);
        })
        .catch(function (err) {
          panel.innerHTML = '<p class="alert">Calibration failed: ' + err.message + '</p>';
          btn.disabled = false;
        });
    });
  }

  wireAutoCalibrate();
})();
</script>

<script>
/* "Auto-add all where this person is the top match": a background sweep that
   confirms every unnamed face whose closest known person is THIS person (no one
   else matches it more strongly). Mirrors the ⚡ match-faces job's poll UI. */
(function () {
  var name = {{ name | tojson }};
  var btn = document.getElementById('auto-add-top-match-btn');
  var status = document.getElementById('auto-add-top-match-status');
  if (!btn) return;
  var base = '/api/identities/' + encodeURIComponent(name);

  function poll() {
    fetch(base + '/auto-add-status').then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) { status.textContent = 'error: ' + d.error; btn.disabled = false; return; }
      if (d.running) {
        status.textContent = 'scanning ' + (d.done || 0).toLocaleString() + '/' + (d.total || 0).toLocaleString() +
                             ' · added ' + (d.matched || 0).toLocaleString();
        setTimeout(poll, 1500);
      } else {
        status.textContent = d.total ? ('done · added ' + (d.matched || 0).toLocaleString() +
                                        ' of ' + (d.total || 0).toLocaleString() + ' scanned') : '';
        btn.disabled = false;
      }
    }).catch(function (e) { status.textContent = 'status failed: ' + e.message; btn.disabled = false; });
  }

  btn.addEventListener('click', function () {
    if (!confirm('Add every unnamed face whose closest known person is ' + name +
                 ' to ' + name + '? This runs in the background and confirms matches automatically.')) return;
    btn.disabled = true;
    status.textContent = 'starting…';
    fetch(base + '/auto-add-until-other-match', { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.started === false) { status.textContent = d.message || 'could not start'; btn.disabled = false; return; }
        poll();
      })
      .catch(function (e) { status.textContent = 'failed: ' + e.message; btn.disabled = false; });
  });

  // Resume the status line if a sweep is already running (e.g. after a reload).
  poll();
})();
</script>
{% endblock %}
