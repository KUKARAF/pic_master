{% extends "base.html" %}

{% block title %}{{ feed_title or 'Queue' }} — media{% endblock %}

{% block container_class %}feed-page{% endblock %}

{% block content %}
<div class="feed-header">
  <h1 class="feed-title">{{ feed_title or '▚ Queue' }}</h1>
  {% if source == 'unloved' %}
  <div class="feed-filters sub">
    <label><input type="checkbox" class="unloved-filter" data-key="no_name" checked> no name</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_set" checked> no set</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_tag" checked> no tag</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_category" checked> no category</label>
  </div>
  {% endif %}
</div>

<div class="feed" id="feed"></div>
<div id="feed-status"></div>

<style>
  :root { --feed-h: 80vh; }
  .container.feed-page { max-width:none; padding:0; }
  .feed-header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:0; padding:10px 14px 6px; }
  .feed-title { margin:0; }
  .feed-filters { display:flex; gap:14px; flex-wrap:wrap; }
  .feed-filters label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .feed { height: var(--feed-h); overflow-y:auto; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; background:#000; }
  .feed { scrollbar-width:none; -ms-overflow-style:none; }
  .feed::-webkit-scrollbar { display:none; }
  .feed-item { height: var(--feed-h); scroll-snap-align:start; scroll-snap-stop:always;
    position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
  .feed-item img, .feed-item video { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .feed-caption { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center;
    gap:14px; padding:12px 16px 18px; color:#fff; z-index:6;
    background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  /* /random: caption (heart / filename / Open) is hidden until one tap, like the
     other helpers. Other feeds keep it always visible. */
  .feed-item.is-random .feed-caption { opacity:0; pointer-events:none; transition:opacity .15s ease; }
  .feed-item.is-random.helpers-on .feed-caption { opacity:1; pointer-events:auto; }
  .feed-caption a { color:#fff; }
  .feed-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.9em; }
  .feed-heart { background:none; border:none; color:#fff; font-size:1.4em; cursor:pointer; padding:4px 6px; }
  .feed-heart.is-fav { color:#ff5b7f; }
  .feed-open { text-decoration:none; font-size:0.85em; border:1px solid rgba(255,255,255,.5);
    border-radius:var(--radius); padding:4px 10px; white-space:nowrap; }
  .feed-muted { position:absolute; top:52px; right:12px; z-index:5; background:rgba(0,0,0,.5);
    color:#fff; border:none; border-radius:50%; width:34px; height:34px; font-size:1em; cursor:pointer; }
  /* Interactive /random: a thin transparent square drawn ON each named face.
     Tapping it injects more photos of that person into the mix. Positioned in JS
     (contain-fit math) once the image loads. */
  /* Overlays stay hidden until one tap reveals them (see showHelpers()). */
  .feed-face-layer { position:absolute; inset:0; z-index:3; pointer-events:none;
    opacity:0; transition:opacity .15s ease; }
  .feed-item.helpers-on .feed-face-layer { opacity:1; }
  .feed-face-box { position:absolute; box-sizing:border-box; background:transparent;
    border:1.5px solid rgba(255,255,255,.75); border-radius:3px; padding:0; margin:0;
    cursor:pointer; pointer-events:none; box-shadow:0 0 0 1px rgba(0,0,0,.35);
    transition:border-color .12s, background .12s; }
  .feed-item.helpers-on .feed-face-box { pointer-events:auto; }
  .feed-face-box:hover, .feed-face-box:active { border-color:#79f279; background:rgba(121,242,121,.18); }
  /* Interactive /random: swipe-right (set) on the right edge, swipe-left (category)
     on the left edge. Each shows an arrow hinting the swipe + the name turned 90° and
     transparent. Tapping the strip works too (desktop). */
  .feed-swipe { position:absolute; top:0; bottom:64px; width:46px; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:rgba(255,255,255,.6); pointer-events:none; cursor:pointer;
    opacity:0; transition:opacity .15s ease; -webkit-user-select:none; user-select:none; }
  .feed-item.helpers-on .feed-swipe { opacity:1; pointer-events:auto; }
  .feed-swipe.right { right:0; }
  .feed-swipe.left { left:0; }
  .feed-swipe[hidden] { display:none; }
  .feed-swipe-label { writing-mode:vertical-rl; text-orientation:mixed; font-size:0.86em;
    letter-spacing:1px; max-height:62%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    opacity:.65; text-shadow:0 1px 3px #000; }
  .feed-swipe.left .feed-swipe-label { transform:rotate(180deg); }
  .feed-swipe-arrow { font-size:1.5em; opacity:.7; text-shadow:0 1px 3px #000;
    animation:feedSwipeHint 1.8s ease-in-out infinite; }
  .feed-swipe.right .feed-swipe-arrow { animation-name:feedSwipeHintR; }
  .feed-swipe.left  .feed-swipe-arrow { animation-name:feedSwipeHintL; }
  @keyframes feedSwipeHintR { 0%,100%{transform:translateX(0);opacity:.5} 50%{transform:translateX(5px);opacity:.9} }
  @keyframes feedSwipeHintL { 0%,100%{transform:translateX(0);opacity:.5} 50%{transform:translateX(-5px);opacity:.9} }
  .feed-swipe.flash { color:#79f279; }
  .feed-swipe.flash .feed-swipe-arrow, .feed-swipe.flash .feed-swipe-label { opacity:1; }
  .feed-progress { position:absolute; left:0; right:0; bottom:0; height:4px; z-index:4;
    background:rgba(255,255,255,.22); cursor:pointer; }
  .feed-progress:hover { height:8px; }
  .feed-progress-fill { height:100%; width:0; background:#fff; }
  #feed-status { position:fixed; left:0; right:0; bottom:6px; text-align:center; z-index:5;
    pointer-events:none; color:#fff; font-size:0.85em; text-shadow:0 1px 3px #000; }
</style>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var source = {{ source | tojson }};
  var feed = document.getElementById('feed');
  var statusEl = document.getElementById('feed-status');
  if (!feed) return;

  var offset = 0, loading = false, hasMore = true;
  var seen = {};
  var soundOn = false;
  var activeItem = null;   // the item most in view (set by playObs) — inject after it

  // Inject "more like this" into the mix (identity / set / similar), right after the
  // current item. /random only. Dedupes against `seen`.
  function injectFrom(kind, value) {
    var exclude = Object.keys(seen).map(Number);
    fetch('/api/feed/more', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, value: String(value), exclude: exclude }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      var anchor = activeItem, added = 0;
      (d.items || []).forEach(function (it) {
        if (seen[it.file_id]) return;
        seen[it.file_id] = true;
        var node = makeItem(it.file_id, null);
        fillMeta(node, it);
        if (anchor && anchor.parentNode) { anchor.parentNode.insertBefore(node, anchor.nextSibling); anchor = node; }
        else feed.appendChild(node);
        added++;
      });
      if (window.showToast) showToast(added ? ('Added ' + added + ' to the mix') : 'Nothing new to add');
    }).catch(function (e) { if (window.showToast) showToast('Failed: ' + e.message); });
  }

  function doFavorite(item) {
    fetch('/api/files/' + item.dataset.fileId + '/favorite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: 1 }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      var h = item.querySelector('.feed-heart');
      if (h) { h.classList.add('is-fav'); h.textContent = '♥ ' + d.count; }
    }).catch(function () {});
  }


  function sizeFeed() {
    var top = feed.getBoundingClientRect().top;
    document.documentElement.style.setProperty('--feed-h', Math.max(200, window.innerHeight - top) + 'px');
    if (source === 'random') feed.querySelectorAll('.feed-item').forEach(positionFaceBoxes);
  }
  window.addEventListener('resize', sizeFeed);
  sizeFeed();

  function unlovedParams() {
    var p = {};
    document.querySelectorAll('.unloved-filter').forEach(function (cb) { p[cb.dataset.key] = cb.checked; });
    return p;
  }

  // --- media mount/unmount (shared by every source) --------------------------------
  function mountMedia(item) {
    if (item.dataset.mounted === '1' || item.dataset.metaLoaded === '0') return;
    item.dataset.mounted = '1';
    var id = item.dataset.fileId;
    if (item.dataset.isVideo === '1') {
      var video = document.createElement('video');
      video.src = '/image/' + id;
      video.loop = true; video.playsInline = true; video.muted = !soundOn; video.preload = 'auto';
      item.insertBefore(video, item.firstChild);
      var mbtn = document.createElement('button');
      mbtn.type = 'button'; mbtn.className = 'feed-muted'; mbtn.textContent = video.muted ? '🔇' : '🔊';
      mbtn.addEventListener('click', function (e) {
        e.stopPropagation();
        soundOn = video.muted; video.muted = !soundOn;
        mbtn.textContent = video.muted ? '🔇' : '🔊';
      });
      item.appendChild(mbtn);
      var prog = document.createElement('div');
      prog.className = 'feed-progress';
      var fill = document.createElement('div');
      fill.className = 'feed-progress-fill';
      prog.appendChild(fill);
      video.addEventListener('timeupdate', function () {
        if (video.duration) fill.style.width = (video.currentTime / video.duration * 100) + '%';
      });
      prog.addEventListener('click', function (e) {
        if (!video.duration) return;
        var r = prog.getBoundingClientRect();
        video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * video.duration;
      });
      item.appendChild(prog);
    } else {
      var img = document.createElement('img');
      img.src = '/image/' + id; img.loading = 'eager'; img.alt = '';
      img.draggable = false;  // else a horizontal mouse-drag starts a native image-drag and eats the swipe
      if (source === 'random') img.addEventListener('load', function () { positionFaceBoxes(item); });
      item.insertBefore(img, item.firstChild);
    }
  }

  function unmountMedia(item) {
    if (item.dataset.mounted !== '1') return;
    item.dataset.mounted = '0';
    var v = item.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    item.querySelectorAll('video, img, .feed-muted, .feed-progress').forEach(function (el) { el.remove(); });
    var layer = item.querySelector('.feed-face-layer');
    if (layer) layer.innerHTML = '';  // face-box coords are stale once the image is gone
  }

  var mountObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        if (source === 'queue') ensureMeta(e.target).then(function () { mountMedia(e.target); });
        else mountMedia(e.target);
      } else unmountMedia(e.target);
    });
  }, { root: feed, rootMargin: '120% 0px', threshold: 0 });

  var playObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        activeItem = e.target;
        if (source === 'queue') onActive(e.target);
      }
      var v = e.target.querySelector('video');
      if (!v) return;
      if (e.isIntersecting) { v.muted = !soundOn; v.currentTime = 0; v.play().catch(function () {}); }
      else { v.pause(); }
    });
  }, { root: feed, threshold: 0.7 });

  // --- caption ---------------------------------------------------------------------
  function fillMeta(item, it) {
    item.dataset.isVideo = it.is_video ? '1' : '0';
    item.dataset.metaLoaded = '1';
    var cap = item.querySelector('.feed-caption');
    cap.innerHTML =
      '<button type="button" class="feed-heart' + (it.favorite ? ' is-fav' : '') + '" title="Favorite">' +
        (it.favorite ? '♥ ' + it.favorite : '♡') + '</button>' +
      '<span class="feed-name">' + escapeHtml(it.filename) + '</span>' +
      '<a class="feed-open" href="/photo/' + it.file_id + '">Open</a>';
    cap.querySelector('.feed-heart').addEventListener('click', function () {
      var h = cap.querySelector('.feed-heart');
      fetch('/api/files/' + it.file_id + '/favorite', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: 1 }),
      }).then(function (r) { return r.json(); }).then(function (d) {
        h.classList.add('is-fav'); h.textContent = '♥ ' + d.count;
      }).catch(function () {});
    });
    // /random experimentation: remember faces (transparent squares), sets (swipe right),
    // and categories (swipe left) for this item.
    item._sets = it.sets || [];
    item._faces = it.faces || [];
    item._cats = it.categories || [];
    if (source === 'random') {
      positionFaceBoxes(item);  // no-op until the image has loaded; re-run on load/resize

      var right = item.querySelector('.feed-swipe.right');
      if (right) {
        if (item._sets.length) {
          right.hidden = false;
          right.querySelector('.feed-swipe-label').textContent = item._sets[0].name;
          right.title = 'Swipe right / tap → add more from set "' + item._sets[0].name + '"';
        } else { right.hidden = true; }
      }
      var left = item.querySelector('.feed-swipe.left');
      if (left) {
        if (item._cats.length) {
          left.hidden = false;
          left.querySelector('.feed-swipe-label').textContent = item._cats[0].name;
          left.title = 'Swipe left / tap → add more from category "' + item._cats[0].name + '"';
        } else { left.hidden = true; }
      }
    }
  }

  // Draw the thin transparent squares over each named face. Uses contain-fit math
  // against the actual rendered <img> (bboxes are original-image pixels). Called on
  // image load and on resize; a no-op for videos and unloaded images.
  function positionFaceBoxes(item) {
    if (source !== 'random') return;
    var layer = item.querySelector('.feed-face-layer');
    if (!layer) return;
    layer.innerHTML = '';
    if (item.dataset.isVideo === '1') return;
    var faces = item._faces || [];
    var img = item.querySelector('img');
    if (!img || !img.naturalWidth || !faces.length) return;
    var itemRect = item.getBoundingClientRect();
    var imgRect = img.getBoundingClientRect();
    var offsetX = imgRect.left - itemRect.left, offsetY = imgRect.top - itemRect.top;
    var scale = img.clientWidth / img.naturalWidth;  // element == rendered image (aspect preserved)
    faces.forEach(function (f) {
      var box = document.createElement('button');
      box.type = 'button'; box.className = 'feed-face-box'; box.title = '👤 ' + f.identity;
      box.style.left = (offsetX + f.x1 * scale) + 'px';
      box.style.top = (offsetY + f.y1 * scale) + 'px';
      box.style.width = ((f.x2 - f.x1) * scale) + 'px';
      box.style.height = ((f.y2 - f.y1) * scale) + 'px';
      box.addEventListener('click', function (e) { e.stopPropagation(); injectFrom('identity', f.identity); });
      layer.appendChild(box);
    });
  }

  function flashSwipe(el) {
    if (!el) return;
    el.classList.add('flash');
    setTimeout(function () { el.classList.remove('flash'); }, 350);
  }
  function triggerSet(item) {
    if (!item || !item._sets || !item._sets.length) return;  // nothing to add — just ignore
    flashSwipe(item.querySelector('.feed-swipe.right'));
    injectFrom('set', item._sets[0].id);
  }
  function triggerCategory(item) {
    if (!item || !item._cats || !item._cats.length) return;
    flashSwipe(item.querySelector('.feed-swipe.left'));
    injectFrom('category', item._cats[0].name);
  }

  // Reveal the helper chrome for one tap — the caption (heart / filename / Open) plus
  // the face squares and swipe arrows/labels. Auto-hides so the image stays clean.
  function showHelpers(item) {
    item.classList.add('helpers-on');
    if (item._hideTimer) clearTimeout(item._hideTimer);
    item._hideTimer = setTimeout(function () { item.classList.remove('helpers-on'); }, 4000);
  }

  function makeItem(id, idx) {
    var section = document.createElement('div');
    section.className = 'feed-item' + (source === 'random' ? ' is-random' : '');
    section.dataset.fileId = id;
    if (idx != null) section.dataset.idx = idx;
    section.dataset.mounted = '0';
    section.dataset.metaLoaded = '0';
    if (source === 'random') {
      section.appendChild(Object.assign(document.createElement('div'), { className: 'feed-face-layer' }));
      // Right-edge swipe affordance → add more from the set; left-edge → add more from category.
      var right = document.createElement('div');
      right.className = 'feed-swipe right'; right.hidden = true;
      right.innerHTML = '<span class="feed-swipe-label"></span><span class="feed-swipe-arrow">→</span>';
      right.addEventListener('click', function (e) { e.stopPropagation(); triggerSet(section); });
      section.appendChild(right);
      var left = document.createElement('div');
      left.className = 'feed-swipe left'; left.hidden = true;
      left.innerHTML = '<span class="feed-swipe-arrow">←</span><span class="feed-swipe-label"></span>';
      left.addEventListener('click', function (e) { e.stopPropagation(); triggerCategory(section); });
      section.appendChild(left);
    }
    section.appendChild(Object.assign(document.createElement('div'), { className: 'feed-caption' }));
    if (source === 'random') {
      // One pointer handler for the whole gesture set (mouse + touch, so it works on
      // desktop too — the earlier touch-only version was dead under a mouse). We never
      // preventDefault, so vertical scroll-snap is untouched. Taps on the interactive
      // overlays (face squares / swipe strips / caption controls) are left to their own
      // click handlers.
      //   horizontal drag → set (right) / category (left)
      //   single tap      → reveal helpers (face squares + swipe arrows)
      //   fast double tap → favorite + inject visually-similar
      var downX = 0, downY = 0, downT = 0, isDown = false, tapTimer = null;
      section.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        downX = e.clientX; downY = e.clientY; downT = e.timeStamp; isDown = true;
      });
      section.addEventListener('pointerup', function (e) {
        if (!isDown) return; isDown = false;
        if (e.target.closest('.feed-caption, .feed-muted, .feed-progress, .feed-face-box, .feed-swipe')) return;
        var dx = e.clientX - downX, dy = e.clientY - downY, dt = e.timeStamp - downT;
        if (Math.abs(dx) >= 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {   // horizontal swipe
          if (dx > 0) triggerSet(section); else triggerCategory(section);
          return;
        }
        if (Math.abs(dx) > 12 || Math.abs(dy) > 12 || dt > 600) return;  // a scroll / long-press, not a tap
        if (tapTimer) {  // second tap inside the window → double tap
          clearTimeout(tapTimer); tapTimer = null;
          doFavorite(section); injectFrom('similar', section.dataset.fileId);
        } else {
          tapTimer = setTimeout(function () { tapTimer = null; showHelpers(section); }, 280);
        }
      });
    }
    mountObs.observe(section);
    playObs.observe(section);
    return section;
  }

  // --- source: watch queue (ids from sessionStorage; captions fetched lazily) ------
  var queueTotal = 0;
  function ensureMeta(item) {
    if (item.dataset.metaLoaded === '1') return Promise.resolve();
    var batch = [], nodes = [], el = item;
    while (el && batch.length < 16) {
      if (el.classList && el.classList.contains('feed-item') &&
          el.dataset.metaLoaded === '0' && el.dataset.fetching !== '1') {
        el.dataset.fetching = '1'; batch.push(parseInt(el.dataset.fileId, 10)); nodes.push(el);
      }
      el = el.nextElementSibling;
    }
    if (!batch.length) return Promise.resolve();
    return fetch('/api/feed/queue', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: batch }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      var byId = {};
      (d.items || []).forEach(function (it) { byId[it.file_id] = it; });
      nodes.forEach(function (n) {
        n.dataset.fetching = '0';
        var it = byId[parseInt(n.dataset.fileId, 10)];
        if (it) fillMeta(n, it); else n.dataset.metaLoaded = '1';  // deleted → mark done, leave blank
      });
    }).catch(function () { nodes.forEach(function (n) { n.dataset.fetching = '0'; }); });
  }

  function onActive(item) {
    var idx = parseInt(item.dataset.idx, 10);
    if (isNaN(idx)) return;
    statusEl.textContent = (idx + 1) + ' / ' + queueTotal;
    try {
      var q = JSON.parse(sessionStorage.getItem('photoQueue') || '{}');
      if (q && q.ids) { q.cursor = idx; sessionStorage.setItem('photoQueue', JSON.stringify(q)); }
    } catch (e) {}
  }

  function buildQueue() {
    var q = {};
    try { q = JSON.parse(sessionStorage.getItem('photoQueue') || '{}'); } catch (e) {}
    var ids = q.ids || [];
    queueTotal = ids.length;
    if (!ids.length) {
      feed.innerHTML = '<div class="feed-item"><div class="swipe-empty">No queue — open photos from a grid or search.<br>' +
        '<a href="/files" style="color:#fff">Browse files</a></div></div>';
      return;
    }
    var frag = document.createDocumentFragment();
    ids.forEach(function (id, idx) { frag.appendChild(makeItem(id, idx)); });
    feed.appendChild(frag);
    var cursor = Math.max(0, Math.min(ids.length - 1, q.cursor || 0));
    var target = feed.children[cursor];
    if (target) { target.scrollIntoView(); statusEl.textContent = (cursor + 1) + ' / ' + queueTotal; }
  }

  // --- source: browse feeds (biggest/random/favorites/unloved), forward paging -----
  function loadMore() {
    if (loading || !hasMore) return;
    loading = true;
    statusEl.textContent = 'Loading…';
    var params = new URLSearchParams(Object.assign({ source: source, offset: offset, limit: 8 },
      source === 'unloved' ? unlovedParams() : {}));
    fetch('/api/feed?' + params.toString())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var added = 0;
        (d.items || []).forEach(function (it) {
          if (seen[it.file_id]) return;
          seen[it.file_id] = true;
          var section = makeItem(it.file_id, null);
          fillMeta(section, it);
          feed.appendChild(section);
          added++;
        });
        offset += (d.items || []).length;
        hasMore = d.has_more && (source !== 'random' || added > 0);
        statusEl.textContent = feed.children.length
          ? (hasMore ? '' : '— end —')
          : 'Nothing here' + (source === 'unloved' ? ' — everything ticked has been handled.' : '.');
        loading = false;
        if (hasMore && feed.scrollHeight <= feed.clientHeight + 10) loadMore();
      })
      .catch(function (e) { statusEl.textContent = 'Failed: ' + e.message; loading = false; });
  }

  feed.addEventListener('scroll', function () {
    if (source === 'queue') return;
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - feed.clientHeight * 1.5) loadMore();
  });

  // Up/Down (and k/j) step one item — scroll-snap containers don't move on arrow keys.
  function isTyping(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable); }
  document.addEventListener('keydown', function (e) {
    if (isTyping(document.activeElement) || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' }); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' }); }
    // /random: ← / → mirror the edge swipes (category / set) on the active item.
    else if (source === 'random' && e.key === 'ArrowRight') { e.preventDefault(); triggerSet(activeItem); }
    else if (source === 'random' && e.key === 'ArrowLeft') { e.preventDefault(); triggerCategory(activeItem); }
  });

  function reset() {
    feed.querySelectorAll('.feed-item').forEach(function (it) {
      mountObs.unobserve(it); playObs.unobserve(it); unmountMedia(it);
    });
    feed.innerHTML = '';
    offset = 0; loading = false; hasMore = true; seen = {};
    loadMore();
  }
  document.querySelectorAll('.unloved-filter').forEach(function (cb) { cb.addEventListener('change', reset); });

  if (source === 'queue') buildQueue();
  else loadMore();
})();
</script>
{% endblock %}
