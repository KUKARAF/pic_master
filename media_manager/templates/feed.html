{% extends "base.html" %}

{% block title %}{{ feed_title }} — media{% endblock %}

{% block container_class %}feed-page{% endblock %}

{% block content %}
<div class="feed-header">
  <h1 class="feed-title">{{ feed_title }}</h1>
  {% if source == 'unloved' %}
  <div class="feed-filters sub">
    <label><input type="checkbox" class="unloved-filter" data-key="no_name" checked> no name</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_set" checked> no set</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_tag" checked> no tag</label>
    <label><input type="checkbox" class="unloved-filter" data-key="no_category" checked> no category</label>
  </div>
  {% endif %}
</div>

<div class="feed" id="feed"></div>
<div id="feed-status"></div>

<style>
  :root { --feed-h: 80vh; }  /* JS sets the exact px height so nothing overflows */
  /* Full-bleed on feed pages: kill the .container padding/max-width that otherwise
     leaves a navbar-height scroll below the feed. */
  .container.feed-page { max-width:none; padding:0; }
  .feed-header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:0; padding:10px 14px 6px; }
  .feed-title { margin:0; }
  .feed-filters { display:flex; gap:14px; flex-wrap:wrap; }
  .feed-filters label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .feed { height: var(--feed-h); overflow-y:auto; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain; background:#000; }
  .feed { scrollbar-width:none; -ms-overflow-style:none; }
  .feed::-webkit-scrollbar { display:none; }
  .feed-item { height: var(--feed-h); scroll-snap-align:start; scroll-snap-stop:always;
    position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
  .feed-item img, .feed-item video { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .feed-caption { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center;
    gap:14px; padding:12px 16px 18px; color:#fff; z-index:2;
    background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  .feed-caption a { color:#fff; }
  .feed-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.9em; }
  .feed-heart { background:none; border:none; color:#fff; font-size:1.4em; cursor:pointer; padding:4px 6px; }
  .feed-heart.is-fav { color:#ff5b7f; }
  .feed-open { text-decoration:none; font-size:0.85em; border:1px solid rgba(255,255,255,.5);
    border-radius:var(--radius); padding:4px 10px; white-space:nowrap; }
  .feed-muted { position:absolute; top:10px; right:12px; z-index:3; background:rgba(0,0,0,.5);
    color:#fff; border:none; border-radius:50%; width:34px; height:34px; font-size:1em; cursor:pointer; }
  /* Slim seekable progress bar at the very bottom edge (native controls would cover the caption). */
  .feed-progress { position:absolute; left:0; right:0; bottom:0; height:4px; z-index:4;
    background:rgba(255,255,255,.22); cursor:pointer; }
  .feed-progress:hover { height:8px; }
  .feed-progress-fill { height:100%; width:0; background:#fff; }
  #feed-status { position:fixed; left:0; right:0; bottom:6px; text-align:center; z-index:5;
    pointer-events:none; color:#fff; font-size:0.85em; text-shadow:0 1px 3px #000; }
</style>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var source = {{ source | tojson }};
  var feed = document.getElementById('feed');
  var statusEl = document.getElementById('feed-status');
  if (!feed) return;

  var offset = 0, loading = false, hasMore = true;
  var seen = {};
  var soundOn = false;

  // Size the feed to exactly fill from its top to the viewport bottom — measured, so
  // it works regardless of navbar/header height and never leaves a stray scroll.
  function sizeFeed() {
    // Fill from the feed's top edge to the bottom of the viewport — exact, so nothing
    // below it (padding/status) creates a stray scroll.
    var top = feed.getBoundingClientRect().top;
    document.documentElement.style.setProperty('--feed-h', Math.max(200, window.innerHeight - top) + 'px');
  }
  window.addEventListener('resize', sizeFeed);
  sizeFeed();

  function unlovedParams() {
    var p = {};
    document.querySelectorAll('.unloved-filter').forEach(function (cb) { p[cb.dataset.key] = cb.checked; });
    return p;
  }

  function mountMedia(item) {
    if (item.dataset.mounted === '1') return;
    item.dataset.mounted = '1';
    var id = item.dataset.fileId;
    if (item.dataset.isVideo === '1') {
      var video = document.createElement('video');
      video.src = '/image/' + id;
      video.loop = true; video.playsInline = true; video.muted = !soundOn; video.preload = 'auto';
      video.addEventListener('click', function () {
        soundOn = video.muted; video.muted = !soundOn;
        var b = item.querySelector('.feed-muted'); if (b) b.textContent = video.muted ? '🔇' : '🔊';
      });
      item.insertBefore(video, item.firstChild);

      var mbtn = document.createElement('button');
      mbtn.type = 'button'; mbtn.className = 'feed-muted'; mbtn.textContent = video.muted ? '🔇' : '🔊';
      mbtn.addEventListener('click', function (e) { e.stopPropagation(); video.click(); });
      item.appendChild(mbtn);

      var prog = document.createElement('div');
      prog.className = 'feed-progress';
      var fill = document.createElement('div');
      fill.className = 'feed-progress-fill';
      prog.appendChild(fill);
      video.addEventListener('timeupdate', function () {
        if (video.duration) fill.style.width = (video.currentTime / video.duration * 100) + '%';
      });
      prog.addEventListener('click', function (e) {
        if (!video.duration) return;
        var r = prog.getBoundingClientRect();
        video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * video.duration;
      });
      item.appendChild(prog);
    } else {
      var img = document.createElement('img');
      img.src = '/image/' + id; img.loading = 'eager'; img.alt = '';
      item.insertBefore(img, item.firstChild);
    }
  }

  function unmountMedia(item) {
    if (item.dataset.mounted !== '1') return;
    item.dataset.mounted = '0';
    var v = item.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    item.querySelectorAll('video, img, .feed-muted, .feed-progress').forEach(function (el) { el.remove(); });
  }

  var mountObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) mountMedia(e.target); else unmountMedia(e.target); });
  }, { root: feed, rootMargin: '120% 0px', threshold: 0 });

  var playObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var v = e.target.querySelector('video');
      if (!v) return;
      if (e.isIntersecting) { v.muted = !soundOn; v.currentTime = 0; v.play().catch(function () {}); }
      else { v.pause(); }
    });
  }, { root: feed, threshold: 0.7 });

  function itemNode(it) {
    var section = document.createElement('div');
    section.className = 'feed-item';
    section.dataset.fileId = it.file_id;
    section.dataset.isVideo = it.is_video ? '1' : '0';
    section.dataset.mounted = '0';
    var cap = document.createElement('div');
    cap.className = 'feed-caption';
    cap.innerHTML =
      '<button type="button" class="feed-heart' + (it.favorite ? ' is-fav' : '') + '" title="Favorite">' +
        (it.favorite ? '♥ ' + it.favorite : '♡') + '</button>' +
      '<span class="feed-name">' + escapeHtml(it.filename) + '</span>' +
      '<a class="feed-open" href="/photo/' + it.file_id + '">Open</a>';
    cap.querySelector('.feed-heart').addEventListener('click', function () {
      var h = cap.querySelector('.feed-heart');
      fetch('/api/files/' + it.file_id + '/favorite', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta: 1 }),
      }).then(function (r) { return r.json(); }).then(function (d) {
        h.classList.add('is-fav'); h.textContent = '♥ ' + d.count;
      }).catch(function () {});
    });
    section.appendChild(cap);
    mountObs.observe(section);
    playObs.observe(section);
    return section;
  }

  function loadMore() {
    if (loading || !hasMore) return;
    loading = true;
    statusEl.textContent = 'Loading…';
    var params = new URLSearchParams(Object.assign({ source: source, offset: offset, limit: 8 },
      source === 'unloved' ? unlovedParams() : {}));
    fetch('/api/feed?' + params.toString())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var added = 0;
        (d.items || []).forEach(function (it) {
          if (seen[it.file_id]) return;
          seen[it.file_id] = true;
          feed.appendChild(itemNode(it));
          added++;
        });
        offset += (d.items || []).length;
        hasMore = d.has_more && (source !== 'random' || added > 0);
        statusEl.textContent = feed.children.length
          ? (hasMore ? '' : '— end —')
          : 'Nothing here' + (source === 'unloved' ? ' — everything ticked has been handled.' : '.');
        loading = false;
        if (hasMore && feed.scrollHeight <= feed.clientHeight + 10) loadMore();
      })
      .catch(function (e) { statusEl.textContent = 'Failed: ' + e.message; loading = false; });
  }

  feed.addEventListener('scroll', function () {
    if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - feed.clientHeight * 1.5) loadMore();
  });

  function reset() {
    feed.querySelectorAll('.feed-item').forEach(function (it) {
      mountObs.unobserve(it); playObs.unobserve(it); unmountMedia(it);
    });
    feed.innerHTML = '';
    offset = 0; loading = false; hasMore = true; seen = {};
    loadMore();
  }

  document.querySelectorAll('.unloved-filter').forEach(function (cb) { cb.addEventListener('change', reset); });
  loadMore();
})();
</script>
{% endblock %}
