<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}media{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>

<nav class="nav">
  <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
  <div class="nav-links" id="nav-links">
    <a class="nav-link" href="/">Gallery</a>
    <a class="nav-link" href="/files">Files</a>
    <a class="nav-link" href="/faces">Faces</a>
    <a class="nav-link" href="/tags">Tags</a>
    <a class="nav-link" href="/categories">Categories</a>
    <a class="nav-link" href="/locations">Locations</a>
    <a class="nav-link" href="/sets">Sets</a>
    <a class="nav-link" href="/studios">Studios</a>
    <a class="nav-link" href="/duplicates">Duplicates</a>
    <a class="nav-link" href="/stats">Stats</a>
  </div>

  <!-- Media worker status: green ✓ when a worker is reachable, red when
       configured-but-offline, hidden when no worker is enabled. Populated by
       app.js polling /api/worker/status. Label is a wrench (🔧); the dot + title
       carry the status. -->
  <span id="worker-badge" class="worker-badge" style="display:none;" title="">
    <span class="worker-dot"></span><span class="worker-label">🔧</span>
  </span>

  <div style="position:relative;">
    <button class="nav-tags-btn" id="bulk-actions-btn" type="button" title="Bulk actions">⚡</button>
    <div class="tags-dropdown" id="bulk-actions-menu">
      <div class="section-title" style="margin-bottom:6px;">Bulk actions</div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/index/start" data-status="/api/index/status">⚡ Index unindexed</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/body-index/start" data-status="/api/body-index/status">🧍 Index bodies</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/match-faces/start" data-status="/api/match-faces/status" data-count="matched">👤 Match faces</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/tile-index/start" data-status="/api/tile-index/status">▦ Index regions</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/metadata/start" data-status="/api/metadata/status">📍 Extract locations</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/fetch-cities/start" data-status="/api/fetch-cities/status">🌍 Download cities</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/match-cities/start" data-status="/api/match-cities/status">🏙 Match cities</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
      <div class="bulk-action-row">
        <button type="button" class="bulk-action-btn" data-start="/api/imdb/rebuild" data-status="/api/imdb/status">🧠 Load index into memory</button>
        <span class="bulk-action-status" data-role="status"></span>
      </div>
    </div>
  </div>

  <div style="position:relative;">
    <button class="nav-tags-btn" id="warn-dropdown-btn" type="button">
      ⚠️<span id="warn-badge" class="warn-badge" style="display:none;">0</span>
    </button>
    <div class="tags-dropdown" id="warn-dropdown-menu">
      <div id="warn-list"></div>
      <button type="button" id="warn-mark-all-btn" style="width:100%;margin-top:6px;display:none;">Mark all read</button>
    </div>
  </div>

  <!-- Neon queue-progress line hugging the bottom of the navbar; shown by the
       photo viewer (app.js) only when browsing a watch queue. -->
  <div id="queue-progress" class="queue-progress"></div>
</nav>

<div class="container {% block container_class %}{% endblock %}">
  {% block content %}{% endblock %}
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="palette-overlay" id="palette-overlay" style="display:none;">
  <div class="palette-box" id="palette-box">
    <div class="palette-input-row">
      <span class="palette-caret">&gt;</span>
      <input type="text" id="palette-input" class="palette-in" autocomplete="off"
             placeholder="search tags &amp; filenames · sort e.g. age:asc, date:desc · click filters at left">
      <span class="palette-count" id="palette-count"></span>
    </div>
    <div class="palette-body">
      <div class="palette-left">
        <div class="palette-applied" id="palette-applied"></div>
        <div class="palette-suggestions" id="palette-suggestions"></div>
      </div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
    <div class="palette-footer">
      <a href="#" id="palette-viewall" class="sub" style="display:none;">Browse results →</a>
      <button type="button" id="palette-hasloc-btn" class="sub" style="background:none;border:none;cursor:pointer;padding:0;"
              title="Filter to photos that have location metadata">📍 Has location</button>
      <span class="sub palette-hint">↑↓ select · Enter apply filter / open results · Esc close</span>
    </div>
  </div>
</div>

<script>
/* Watch queue: clicking into a photo from any grid (gallery, set/category
   detail, search, similar/body-similar) records that grid's file ids +
   the clicked position in sessionStorage, so the photo viewer's Left/Right
   keys browse that exact collection instead of global photo order. */
document.addEventListener('click', function (e) {
  var link = e.target.closest('.card-img-link, .card-name');
  if (!link) return;
  var cardEl = link.closest('.card[data-file-id]');
  if (!cardEl) return;
  var container = cardEl.closest('[data-queue-source]') || cardEl.parentElement;
  if (!container) return;
  var cards = Array.prototype.slice.call(container.querySelectorAll('.card[data-file-id]'));
  var ids = cards.map(function (c) { return parseInt(c.dataset.fileId, 10); });
  var cursor = ids.indexOf(parseInt(cardEl.dataset.fileId, 10));
  sessionStorage.setItem('photoQueue', JSON.stringify({
    ids: ids,
    cursor: cursor,
    label: container.dataset.queueSource || document.title,
  }));
});
</script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
